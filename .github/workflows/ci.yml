name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install workspace
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run --all-groups ruff check .

      - name: Check formatting
        run: uv run --all-groups ruff format --check .

      - name: Check types
        run: uv run --all-groups pyright

      - name: Test
        run: uv run --all-groups pytest packages tests

  model-locks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        provider: [carbon, evo2, jepa-dna, ntv3]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Check model lock
        run: uv lock --project environments/models/${{ matrix.provider }} --check
