[project]
name = "atcg-data"
version = "0.1.0"
description = "Read-only access to ATCG-FM datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=21,<26",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atcg"]

