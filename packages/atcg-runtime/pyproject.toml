[project]
name = "atcg-runtime"
version = "0.1.0"
description = "Training and inference runtime for ATCG-FM"
requires-python = ">=3.12,<3.14"
dependencies = [
    "atcg-models",
    "atcg-sequence",
    "torch>=2.6,<3",
]

[tool.uv.sources]
atcg-models = { workspace = true }
atcg-sequence = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atcg"]
