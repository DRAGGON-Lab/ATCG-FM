[project]
name = "atcg-cli"
version = "0.1.0"
description = "Command-line workflows for ATCG-FM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atcg-eval",
    "atcg-models",
    "atcg-runtime",
    "atcg-sequence",
]

[project.scripts]
atcg = "atcg.cli:main"

[tool.uv.sources]
atcg-eval = { workspace = true }
atcg-models = { workspace = true }
atcg-runtime = { workspace = true }
atcg-sequence = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atcg"]

