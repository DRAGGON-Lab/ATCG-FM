[project]
name = "atcg-models"
version = "0.1.0"
description = "PyTorch genomic language models and sequence mixers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atcg"]
